org: ${env:SLS_ORG}
service: papa-johns-order-service

useDotenv: true

provider:
  name: aws
  runtime: python3.14
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  memorySize: 1024
  timeout: 29
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole
  environment:
    ORDERS_TABLE: ${self:service}-orders-${self:provider.stage}
    RECEIPTS_BUCKET: ${self:service}-receipts-${self:provider.stage}
    OCI_WEBHOOK_URL: ${env.OCI_WEBHOOK_URL}

functions:
  createOrder:
    handler: src/handlers/create_order.handler
    events:
      - http:
          path: /tenants/{tenantId}/orders
          method: post
          cors: true

  getOrder:
    handler: src/handlers/get_order.handler
    events:
      - http:
          path: /tenants/{tenantId}/orders/{id}
          method: get
          cors: true

  notifyService:
    handler: src/handlers/notify_service.handler
    events:
      - eventBridge:
          eventBus: default
          pattern:
            source:
              - "com.papajohns.orders"
            detail-type:
              - "OrderStatusUpdated"
              
  processDlq:
    handler: src/handlers/process_dlq.handler
    events:
      - sqs:
          arn: !GetAtt DlqCocina.Arn
          batchSize: 10
      - sqs:
          arn: !GetAtt DlqEmpaque.Arn
          batchSize: 10
      - sqs:
          arn: !GetAtt DlqDespacho.Arn
          batchSize: 10

resources:
  Resources:
    # ---------------------------------------------------------
    # 1. BASES DE DATOS Y ALMACENAMIENTO
    # ---------------------------------------------------------
    OrdersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.ORDERS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: tenantId
            AttributeType: S
          - AttributeName: orderId
            AttributeType: S
        KeySchema:
          - AttributeName: tenantId
            KeyType: HASH
          - AttributeName: orderId
            KeyType: RANGE

    ReceiptsBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:provider.environment.RECEIPTS_BUCKET}

    # ---------------------------------------------------------
    # 2. SISTEMA DE MENSAJERÍA (SNS Fan-out)
    # ---------------------------------------------------------
    SnsTopicCocina:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: ${self:service}-cocina-topic-${self:provider.stage}
        
    SnsTopicEmpaque:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: ${self:service}-empaque-topic-${self:provider.stage}
        
    SnsTopicDespacho:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: ${self:service}-despacho-topic-${self:provider.stage}

    # ---------------------------------------------------------
    # 3. COLAS DE TRABAJO (SQS) Y TOLERANCIA A FALLOS (DLQ)
    # ---------------------------------------------------------
    # --- ETAPA: COCINA ---
    DlqCocina:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-cocina-dlq-${self:provider.stage}
        MessageRetentionPeriod: 1209600

    SqsQueueCocina:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-cocina-queue-${self:provider.stage}
        VisibilityTimeout: 60
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt DlqCocina.Arn
          maxReceiveCount: 3

    SnsSubscriptionCocina:
      Type: AWS::SNS::Subscription
      Properties:
        TopicArn: !Ref SnsTopicCocina
        Endpoint: !GetAtt SqsQueueCocina.Arn
        Protocol: sqs
        RawMessageDelivery: true

    SqsQueueCocinaPolicy:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues:
          - !Ref SqsQueueCocina
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal: '*'
              Action: sqs:SendMessage
              Resource: !GetAtt SqsQueueCocina.Arn
              Condition:
                ArnEquals:
                  aws:SourceArn: !Ref SnsTopicCocina

    # --- ETAPA: EMPAQUE ---
    DlqEmpaque:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-empaque-dlq-${self:provider.stage}
        MessageRetentionPeriod: 1209600

    SqsQueueEmpaque:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-empaque-queue-${self:provider.stage}
        VisibilityTimeout: 60
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt DlqEmpaque.Arn
          maxReceiveCount: 3

    SnsSubscriptionEmpaque:
      Type: AWS::SNS::Subscription
      Properties:
        TopicArn: !Ref SnsTopicEmpaque
        Endpoint: !GetAtt SqsQueueEmpaque.Arn
        Protocol: sqs
        RawMessageDelivery: true

    SqsQueueEmpaquePolicy:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues:
          - !Ref SqsQueueEmpaque
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal: '*'
              Action: sqs:SendMessage
              Resource: !GetAtt SqsQueueEmpaque.Arn
              Condition:
                ArnEquals:
                  aws:SourceArn: !Ref SnsTopicEmpaque

    # --- ETAPA: DESPACHO ---
    DlqDespacho:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-despacho-dlq-${self:provider.stage}
        MessageRetentionPeriod: 1209600

    SqsQueueDespacho:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-despacho-queue-${self:provider.stage}
        VisibilityTimeout: 60
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt DlqDespacho.Arn
          maxReceiveCount: 3

    SnsSubscriptionDespacho:
      Type: AWS::SNS::Subscription
      Properties:
        TopicArn: !Ref SnsTopicDespacho
        Endpoint: !GetAtt SqsQueueDespacho.Arn
        Protocol: sqs
        RawMessageDelivery: true

    SqsQueueDespachoPolicy:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues:
          - !Ref SqsQueueDespacho
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal: '*'
              Action: sqs:SendMessage
              Resource: !GetAtt SqsQueueDespacho.Arn
              Condition:
                ArnEquals:
                  aws:SourceArn: !Ref SnsTopicDespacho

    # ---------------------------------------------------------
    # 4. ORQUESTACIÓN: EVENTBRIDGE Y STEP FUNCTIONS
    # ---------------------------------------------------------
    OrderCreatedRule:
      Type: AWS::Events::Rule
      Properties:
        Description: "Escucha la creacion de pedidos e inicia el Workflow"
        EventPattern:
          source:
            - "com.papajohns.orders"
          detail-type:
            - "OrderCreated"
        State: "ENABLED"
        Targets:
          - Arn: !Ref OrderWorkflow
            Id: "TriggerOrderWorkflow"
            RoleArn: arn:aws:iam::${aws:accountId}:role/LabRole

    OrderWorkflow:
      Type: AWS::StepFunctions::StateMachine
      Properties:
        StateMachineName: ${self:service}-workflow-${self:provider.stage}
        RoleArn: arn:aws:iam::${aws:accountId}:role/LabRole
        DefinitionString: !Sub |
          {
            "Comment": "Flujo ramificado con manejo de DLQ - Papa Johns",
            "StartAt": "Cocina",
            "States": {
              "Cocina": {
                "Type": "Task",
                "Resource": "arn:aws:states:::sns:publish.waitForTaskToken",
                "Parameters": {
                  "TopicArn": "${SnsTopicCocina}",
                  "Message": {
                    "tenantId.$": "$.detail.tenantId",
                    "orderId.$": "$.detail.orderId",
                    "stage": "COCINA",
                    "taskToken.$": "$$.Task.Token"
                  }
                },
                "ResultPath": "$.resultadoTrabajador",
                "Catch": [
                  {
                    "ErrorEquals": ["WORKER_TIMEOUT"],
                    "Next": "PedidoAbandonado"
                  }
                ],
                "Next": "EvaluarDecisionCocina"
              },
              "EvaluarDecisionCocina": {
                "Type": "Choice",
                "Choices": [
                  {
                    "Variable": "$.resultadoTrabajador.nextStage",
                    "StringEquals": "CANCELADO",
                    "Next": "PedidoCancelado"
                  }
                ],
                "Default": "Empaque"
              },
              "Empaque": {
                "Type": "Task",
                "Resource": "arn:aws:states:::sns:publish.waitForTaskToken",
                "Parameters": {
                  "TopicArn": "${SnsTopicEmpaque}",
                  "Message": {
                    "tenantId.$": "$.detail.tenantId",
                    "orderId.$": "$.detail.orderId",
                    "stage": "EMPAQUE",
                    "taskToken.$": "$$.Task.Token"
                  }
                },
                "ResultPath": "$.resultadoTrabajador",
                "Catch": [
                  {
                    "ErrorEquals": ["WORKER_TIMEOUT"],
                    "Next": "PedidoAbandonado"
                  }
                ],
                "Next": "EvaluarDecisionEmpaque"
              },
              "EvaluarDecisionEmpaque": {
                "Type": "Choice",
                "Choices": [
                  {
                    "Variable": "$.resultadoTrabajador.nextStage",
                    "StringEquals": "CANCELADO",
                    "Next": "PedidoCancelado"
                  }
                ],
                "Default": "Despacho"
              },
              "Despacho": {
                "Type": "Task",
                "Resource": "arn:aws:states:::sns:publish.waitForTaskToken",
                "Parameters": {
                  "TopicArn": "${SnsTopicDespacho}",
                  "Message": {
                    "tenantId.$": "$.detail.tenantId",
                    "orderId.$": "$.detail.orderId",
                    "stage": "DESPACHO",
                    "taskToken.$": "$$.Task.Token"
                  }
                },
                "ResultPath": "$.resultadoTrabajador",
                "Catch": [
                  {
                    "ErrorEquals": ["WORKER_TIMEOUT"],
                    "Next": "PedidoAbandonado"
                  }
                ],
                "Next": "Entregado"
              },
              "PedidoCancelado": {
                "Type": "Fail",
                "Cause": "El trabajador rechazo el pedido o fue cancelado por el cliente.",
                "Error": "ORDER_CANCELLED"
              },
              "PedidoAbandonado": {
                "Type": "Fail",
                "Cause": "El pedido fue abandonado operativamente y procesado por la DLQ.",
                "Error": "ABANDONO_OPERATIVO"
              },
              "Entregado": {
                "Type": "Succeed"
              }
            }
          }